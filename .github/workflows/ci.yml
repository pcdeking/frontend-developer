name: My First CI Pipeline

on:
  push:
    branches: [ "main", "feature" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Show files
      run: ls -la

    - name: Simple test
      run: echo "Pipeline is working!"

    - name: Check HTML file
      run: |
        if [ -f index.html ]; then
          echo "HTML file exists ✅"
        else
          echo "HTML file missing ❌"
          exit 1
        fi

    - name: List files
      run: ls -la

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Deploy
      run: echo "Deploying application..."
